<!DOCTYPE html>
<html lang="es-419">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rannaghor | Administración</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --nav-height: 80px;
            --glass-blur: blur(15px);
            --primary-orange: #FF8C00;
        }

        body {
            background: #0a0a0a;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(255, 140, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(220, 20, 60, 0.05) 0%, transparent 50%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: var(--nav-height); /* Space for fixed nav */
        }

        /* Navigation Style (Matches Kitchen) */
        .admin-nav {
            height: var(--nav-height);
            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--color-border);
            z-index: 1000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }

        .admin-nav-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #ffccaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 0.85rem;
            color: var(--primary-orange);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .brand-sub-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
            width: 100%;
        }

        .products-section {
            margin-bottom: var(--space-xl);
            padding: var(--space-xl);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
        }

        .products-section h2 { margin: 0 0 .4rem; }
        .products-intro { margin: 0 0 var(--space-lg); color: var(--color-text-secondary); }
        .product-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--space-md);
        }
        .product-field { display: flex; flex-direction: column; gap: .45rem; }
        .product-field label { color: var(--color-text-secondary); font-size: var(--text-sm); font-weight: 600; }
        .product-field input, .product-field select {
            width: 100%; min-height: 46px; padding: .7rem .85rem; color: #fff;
            background: rgba(0, 0, 0, .35); border: 1px solid var(--color-border);
            border-radius: var(--radius-md); font: inherit;
        }
        .product-field select option { color: #171717; }
        .product-field input:focus, .product-field select:focus { outline: 2px solid var(--primary-orange); outline-offset: 1px; }
        .product-form-actions { grid-column: 1 / -1; display: flex; gap: .75rem; flex-wrap: wrap; }
        .product-message { min-height: 1.5rem; margin: .8rem 0 0; color: #a7f3d0; }
        .product-table-wrap { overflow-x: auto; margin-top: var(--space-xl); }
        .product-table { width: 100%; border-collapse: collapse; min-width: 650px; }
        .product-table th, .product-table td { padding: .85rem .75rem; border-bottom: 1px solid var(--color-border); text-align: left; }
        .product-table th { color: var(--color-text-secondary); font-size: var(--text-sm); }
        .product-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: #222; }
        .product-actions { display: flex; gap: .5rem; }
        .product-actions button { cursor: pointer; }
        .product-edit { color: #fff; background: rgba(255, 140, 0, .18); border: 1px solid rgba(255, 140, 0, .45); }
        .product-delete { color: #fecaca; background: rgba(220, 38, 38, .16); border: 1px solid rgba(248, 113, 113, .35); }
        .product-actions button { padding: .45rem .7rem; border-radius: 8px; font: inherit; }
        .products-empty { padding: 1.5rem; text-align: center !important; color: var(--color-text-secondary); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .qr-management-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: var(--space-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .qr-management-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: var(--space-lg);
        }

        .qr-management-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            transition: all var(--transition-base);
        }

        .qr-management-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .qr-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qr-table-number {
            font-weight: var(--font-bold);
            font-size: var(--text-lg);
        }

        .btn-icon-qr {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--color-border);
            color: var(--color-text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon-qr:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .qr-card-body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-md);
            background: white;
            border-radius: var(--radius-lg);
            aspect-ratio: 1 / 1;
            width: fit-content;
            margin: 0 auto;
        }

        .qr-preview {
            width: 140px;
            height: 140px;
        }

        .qr-card-footer {
            margin-top: auto;
        }

        .btn-full {
            width: 100%;
        }



        /* Controls */
        .admin-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            width: fit-content;
        }

        .admin-controls label {
            font-size: var(--text-sm);
            font-weight: var(--font-bold);
            color: var(--color-text-secondary);
        }

        .admin-controls input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-xs) var(--space-sm);
            width: 70px;
            text-align: center;
            color: white;
            font-weight: var(--font-bold);
            transition: all 0.2s;
        }

        .admin-controls input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(255, 140, 0, 0.2);
        }

        .admin-footer {
            margin-top: auto;
            padding: var(--space-2xl) 0;
            text-align: center;
            opacity: 0.8;
            font-size: var(--text-xs);
        }

        .admin-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            transition: text-decoration 0.2s;
        }

        .admin-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .admin-nav-container {
                padding: 0 1rem;
            }

            .brand-name {
                font-size: 1.4rem;
            }

            .brand-tagline {
                font-size: 0.65rem;
            }

            .nav-actions span {
                display: none; /* Hide button text on small screens */
            }

            .nav-actions .btn {
                padding: 8px;
                min-width: 0;
            }

            .management-header {
                flex-direction: column;
                align-items: stretch;
            }

            .product-form { grid-template-columns: 1fr; }
            .products-section { padding: var(--space-lg); }
        }
    </style>
</head>

<body>
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <div class="nav-brand">
                <div class="brand-icon">
                    <img src="../assets/images/logo.png" alt="Rannaghor Logo">
                </div>
                <div class="brand-text">
                    <span class="brand-name">Rannaghor</span>
                    <div class="brand-sub-row">
                        <span class="brand-tagline">Admin Dashboard</span>
                    </div>
                </div>
            </div>

            <div class="nav-actions">
                <a href="kitchen.html" target="_blank" class="btn btn-primary btn-sm">
                    <i data-lucide="chef-hat"></i>
                    <span>Kitchen</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <section class="products-section" aria-labelledby="productsTitle">
            <h2 id="productsTitle" class="selector-title">Administrar productos</h2>
            <p class="products-intro">Agrega y administra los platos publicados en el menú del restaurante.</p>

            <form id="productForm" class="product-form">
                <input type="hidden" id="productId">
                <div class="product-field">
                    <label for="productName">Nombre del plato</label>
                    <input id="productName" name="name" type="text" maxlength="100" required placeholder="Ej.: Milanesa con papas">
                </div>
                <div class="product-field">
                    <label for="productPrice">Precio</label>
                    <input id="productPrice" name="price" type="number" min="0.01" step="0.01" required placeholder="Ej.: 2500">
                </div>
                <div class="product-field">
                    <label for="productCategory">Categoría</label>
                    <select id="productCategory" name="category" required>
                        <option value="bebidas">Bebidas</option>
                        <option value="minutas">Minutas</option>
                        <option value="entradas">Entradas</option>
                        <option value="platos-principales">Platos principales</option>
                        <option value="biriyani">Biryani</option>
                        <option value="curry">Curry</option>
                        <option value="kebab">Kebab</option>
                        <option value="antojos">Antojitos</option>
                        <option value="postres">Postres</option>
                    </select>
                </div>
                <div class="product-field">
                    <label for="productImage">Imagen del plato</label>
                    <input id="productImage" name="image" type="file" accept="image/*">
                </div>
                <div class="product-form-actions">
                    <button id="saveProductButton" class="btn btn-primary" type="submit">Guardar plato</button>
                    <button id="cancelEditButton" class="btn btn-outline" type="button" hidden>Cancelar edición</button>
                </div>
            </form>
            <p id="productMessage" class="product-message" role="status" aria-live="polite"></p>

            <div class="product-table-wrap">
                <table class="product-table">
                    <thead><tr><th>Imagen</th><th>Plato</th><th>Precio</th><th>Categoría</th><th>Acciones</th></tr></thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
        </section>

        <main class="qr-management-section">
            <div class="management-header">
                <h2 class="selector-title">Table Management</h2>
                <div class="admin-controls">
                    <label for="tableCount">Number of Tables</label>
                    <input type="number" id="tableCount" value="4" min="1" max="100" />
                </div>
            </div>

            <div id="qrGridContainer" class="qr-management-grid">
                <!-- QR Cards will be dynamically injected here -->
            </div>
        </main>

        <footer class="admin-footer">
            <p>
                © 2026 Rannaghor. All rights reserved.
                <br>
                Designed & Developed by
                <a href="https://github.com/tamimtxd" target="_blank">
                    Tamim
                </a>
            </p>
        </footer>
    </div>

    <script src="../js/management.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://gudjaroffkrwmsqvczip.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NbuvsGvR625a6e9dIXAPZw_inbC3j5A';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (() => {
            const form = document.getElementById('productForm');
            const idInput = document.getElementById('productId');
            const nameInput = document.getElementById('productName');
            const priceInput = document.getElementById('productPrice');
            const categoryInput = document.getElementById('productCategory');
            const imageInput = document.getElementById('productImage');
            const tableBody = document.getElementById('productsTableBody');
            const message = document.getElementById('productMessage');
            const saveButton = document.getElementById('saveProductButton');
            const cancelButton = document.getElementById('cancelEditButton');
            let currentImage = '';

            const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);

            let products = [];

            async function loadProducts() {
                tableBody.innerHTML = '<tr><td class="products-empty" colspan="5">Cargando platos…</td></tr>';
                const { data, error } = await supabase
                    .from('platos')
                    .select('id, nombre, precio, categoria, imagen_url');
                if (error) {
                    message.textContent = `No se pudieron cargar los platos: ${error.message}`;
                    tableBody.innerHTML = '<tr><td class="products-empty" colspan="5">Error al cargar los platos.</td></tr>';
                    return;
                }
                products = (data || []).map(plato => ({
                    id: plato.id,
                    name: plato.nombre,
                    price: plato.precio,
                    category: plato.categoria,
                    image: plato.imagen_url
                }));
                renderProducts();
            }

            function renderProducts() {
                if (!products.length) {
                    tableBody.innerHTML = '<tr><td class="products-empty" colspan="5">Todavía no hay platos guardados.</td></tr>';
                    return;
                }

                tableBody.innerHTML = products.map(product => `
                    <tr>
                        <td>${safeImageUrl(product.image) ? `<img class="product-thumb" src="${escapeHTML(safeImageUrl(product.image))}" alt="${escapeHTML(product.name)}" loading="lazy" onerror="this.hidden=true">` : '—'}</td>
                        <td>${escapeHTML(product.name)}</td>
                        <td>${new Intl.NumberFormat('es-419', { maximumFractionDigits: 2 }).format(product.price)}</td>
                        <td>${escapeHTML(categoryLabelFor(product.category))}</td>
                        <td><div class="product-actions">
                            <button type="button" class="product-edit" data-action="edit" data-id="${escapeHTML(product.id)}">Editar</button>
                            <button type="button" class="product-delete" data-action="delete" data-id="${escapeHTML(product.id)}">Eliminar</button>
                        </div></td>
                    </tr>`).join('');
            }

            function categoryLabelFor(category) {
                const option = Array.from(categoryInput.options).find(item => item.value === category);
                return option ? option.textContent : category || '—';
            }

            function safeImageUrl(value) {
                if (typeof value !== 'string' || value.length > 3_000_000) return '';
                if (/^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/]+=*$/i.test(value)) return value;
                try {
                    const url = new URL(value, window.location.href);
                    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
                } catch (_) {
                    return '';
                }
            }

            function resetForm() {
                form.reset();
                idInput.value = '';
                currentImage = '';
                saveButton.textContent = 'Guardar plato';
                cancelButton.hidden = true;
            }

            function readImageAsBase64(file) {
                if (!file || !['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) {
                    return Promise.reject(new Error('Usa una imagen PNG, JPG, WEBP o GIF.'));
                }
                if (file.size > 2 * 1024 * 1024) {
                    return Promise.reject(new Error('La imagen no puede superar los 2 MB.'));
                }
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('No se pudo leer la imagen seleccionada.'));
                    reader.readAsDataURL(file);
                });
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                const name = nameInput.value.trim();
                const price = Number(priceInput.value);
                const category = categoryInput.value;
                const selectedFile = imageInput.files[0];

                if (!name || name.length > 100 || !Number.isFinite(price) || price <= 0 || price > 1_000_000_000 || !Array.from(categoryInput.options).some(option => option.value === category)) {
                    message.textContent = 'Ingresa un nombre y un precio mayor que cero.';
                    return;
                }

                if (selectedFile && !['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(selectedFile.type)) {
                    message.textContent = 'Usa una imagen PNG, JPG, WEBP o GIF.';
                    return;
                }
                if (selectedFile && selectedFile.size > 2 * 1024 * 1024) {
                    message.textContent = 'La imagen no puede superar los 2 MB.';
                    return;
                }

                saveButton.disabled = true;
                try {
                    const image = selectedFile ? await readImageAsBase64(selectedFile) : currentImage;
                    const editingId = idInput.value;
                    const productData = {
                        nombre: name,
                        precio: price,
                        categoria: category,
                        imagen_url: image
                    };
                    if (editingId) {
                        const { error } = await supabase.from('platos').update(productData).eq('id', editingId);
                        if (error) throw error;
                        message.textContent = 'Plato actualizado.';
                    } else {
                        const { error } = await supabase.from('platos').insert([productData]);
                        if (error) throw error;
                        message.textContent = 'Plato guardado.';
                    }

                    resetForm();
                    await loadProducts();
                } catch (error) {
                    message.textContent = error.message || 'No se pudo procesar la imagen.';
                } finally {
                    saveButton.disabled = false;
                }
            });

            tableBody.addEventListener('click', async event => {
                const button = event.target.closest('button[data-action]');
                if (!button) return;
                const product = products.find(item => String(item.id) === button.dataset.id);
                if (!product) return;

                if (button.dataset.action === 'edit') {
                    idInput.value = product.id;
                    nameInput.value = product.name;
                    priceInput.value = product.price;
                    categoryInput.value = product.category;
                    imageInput.value = '';
                    currentImage = product.image || '';
                    saveButton.textContent = 'Guardar cambios';
                    cancelButton.hidden = false;
                    nameInput.focus();
                    message.textContent = `Editando: ${product.name}`;
                } else if (button.dataset.action === 'delete' && window.confirm(`¿Eliminar "${product.name}"?`)) {
                    button.disabled = true;
                    const { error } = await supabase.from('platos').delete().eq('id', product.id);
                    if (error) {
                        message.textContent = `No se pudo eliminar el plato: ${error.message}`;
                        button.disabled = false;
                        return;
                    }
                    if (idInput.value === String(product.id)) resetForm();
                    message.textContent = 'Plato eliminado.';
                    await loadProducts();
                }
            });

            cancelButton.addEventListener('click', () => {
                resetForm();
                message.textContent = 'Edición cancelada.';
            });

            loadProducts();
        })();
    </script>
</body>

</html>
